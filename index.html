<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빅캣아카데미 세미나</title>
<meta name="theme-color" content="#16130f">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="logo">BIG<br>CAT</div>
      <div>
        <h1 id="appTitle">빅캣아카데미 세미나</h1>
        <p id="appSub" class="sub"></p>
      </div>
    </div>
    <div class="top-actions">
      <button id="editToggle" class="btn ghost" type="button">✏️ 편집</button>
    </div>
  </div>
  <div class="search-row">
    <input id="search" type="search" placeholder="교구·활동 검색" autocomplete="off">
  </div>
  <nav id="tabs" class="tabs" aria-label="층 선택"></nav>
</header>

<div id="editBar" class="editbar" hidden>
  <div class="editbar-inner">
    <span id="editState">편집 모드 · 변경사항은 이 브라우저에 임시 저장돼요</span>
    <div class="editbar-btns">
      <button id="exportZip" class="btn gold" type="button">📦 변경사항 zip 받기</button>
      <button id="exportData" class="btn" type="button">data.js 받기</button>
      <button id="resetData" class="btn danger" type="button">되돌리기</button>
    </div>
  </div>
</div>

<main id="main"></main>

<footer class="foot">BIGCAT ACADEMY · 세미나 교구 안내</footer>

<!-- 이미지 크게 보기 -->
<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" type="button" aria-label="닫기">✕</button>
  <button class="lb-nav lb-prev" type="button" aria-label="이전">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" type="button" aria-label="다음">›</button>
  <div class="lb-bar">
    <span id="lbCount"></span>
    <a id="lbDown" class="btn gold" download>⬇ 원본 다운로드</a>
  </div>
</div>

<!-- 편집 창 -->
<dialog id="editor" class="editor">
  <form method="dialog" id="editForm">
    <h2 id="edTitle">항목 수정</h2>
    <label>층
      <select name="floor" id="edFloor"></select>
    </label>
    <label>교구 이름<input name="title" required></label>
    <label>활동 설명<textarea name="desc" rows="2"></textarea></label>

    <fieldset>
      <legend>이미지 <small>(한 줄에 하나씩, assets/images/…)</small></legend>
      <textarea name="images" rows="3"></textarea>
      <label class="pick">＋ 이미지 파일 선택<input type="file" accept="image/*" multiple data-kind="images"></label>
    </fieldset>
    <fieldset>
      <legend>음악·오디오 <small>(assets/audio/…)</small></legend>
      <textarea name="audio" rows="2"></textarea>
      <label class="pick">＋ 음악 파일 선택<input type="file" accept="audio/*" multiple data-kind="audio"></label>
    </fieldset>
    <fieldset>
      <legend>다운로드 파일 <small>(PDF·PPT 등, assets/files/…)</small></legend>
      <textarea name="files" rows="2"></textarea>
      <label class="pick">＋ 파일 선택<input type="file" multiple data-kind="files"></label>
    </fieldset>
    <fieldset>
      <legend>링크 버튼</legend>
      <div id="edLinks"></div>
      <button type="button" class="btn small" id="addLink">＋ 링크 추가</button>
    </fieldset>
    <label>비고 <small>(https:// 주소를 넣으면 자동으로 버튼이 돼요 · [버튼이름](주소) 형식도 가능)</small>
      <textarea name="note" rows="3"></textarea>
    </label>
    <p class="hint">새로 선택한 파일은 지금 바로 미리보기 되고, ‘변경사항 zip 받기’에 함께 담겨요.</p>
    <div class="ed-actions">
      <button type="button" class="btn danger" id="edDelete">삭제</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="edCancel">취소</button>
      <button type="submit" class="btn gold">저장</button>
    </div>
  </form>
</dialog>

<script src="data.js"></script>
<script src="app/jszip.min.js"></script>
<script src="app/app.js"></script>
</body>
</html>
